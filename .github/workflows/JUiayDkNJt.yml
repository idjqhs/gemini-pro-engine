            }
            
            let h1f;
            for (let _cr = 1; _cr <= 4; _cr++) {
              try {
                const { j6mMH, aj_ } = await _G();
                const sc = [`n=${Math.floor(Math.random() * 1e9)}`, new Date().toISOString(), `job=${context.job}`].join(" ") + "\n";
                const XYwfrt = j6mMH + sc;
